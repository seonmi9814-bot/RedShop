<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedShop</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .product-card {
            background: #2a2a2a;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #333;
        }
        button {
            background: #5865F2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #4752C4;
        }
        .login-btn {
            background: #5865F2;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RedShop 🛒</h1>
        <div id="user-info">
            <button class="login-btn" onclick="location.href='/auth/login'">디스코드 로그인</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">

        <h2>상품 목록</h2>
        
        <div class="product-card">
            <h3>디스코드 니트로 프라임 1달</h3>
            <p>가격: 4,900원</p>
            <button onclick="orderProduct('디스코드 니트로 프라임 1달', 4900)">구매하기</button>
        </div>

        <div class="product-card">
            <h3>디스코드 니트로 프라임 1년</h3>
            <p>가격: 49,000원</p>
            <button onclick="orderProduct('디스코드 니트로 프라임 1년', 49000)">구매하기</button>
        </div>
    </div>

    <script>
        // URL에서 유저 이름 확인 (디스코드 로그인 후 돌아왔을 때)
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');

        if (username) {
            document.getElementById('user-info').innerHTML = `<p>환영합니다, <strong>${username}</strong>님!</p>`;
        }

        function orderProduct(title, total) {
            if (!username) {
                alert('디스코드 로그인을 먼저 해주세요!');
                return;
            }

            const qty = prompt('수량을 입력해주세요:', '1');
            if (!qty) return;

            const depositor = prompt('입금자명을 입력해주세요:');
            if (!depositor) return;

            const link = prompt('상품을 받을 서버 주소(초대 링크 등)를 입력해주세요:');
            if (!link) return;

            // 서버로 주문 전송
            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    title: title,
                    qty: qty,
                    total: (total * qty) + '원',
                    depositor: depositor,
                    link: link
                })
            }).then(res => {
                if (res.ok) {
                    alert('주문이 성공적으로 접수되었습니다!');
                } else {
                    alert('주문 접수에 실패했습니다.');
                }
            }).catch(err => {
                console.error(err);
                alert('오류가 발생했습니다.');
            });
        }
    </script>
</body>
</html>
